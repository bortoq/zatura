name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t zatura-builder -f packaging/Dockerfile .
      - name: Build runtime and run regression tests
        run: docker run --rm -v "$PWD/build-ci:/work" zatura-builder
      - name: Create portable archive
        run: make portable RUNTIME=build-ci/build/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: zatura-linux-x86_64
          path: dist/*.tar.gz
